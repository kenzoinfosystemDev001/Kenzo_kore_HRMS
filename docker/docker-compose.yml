version: '3.8'

services:
  # ─── PostgreSQL Database ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kenzo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kenzo_hrms
      POSTGRES_USER: kenzo_user
      POSTGRES_PASSWORD: kenzo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kenzo_user -d kenzo_hrms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (Caching, Sessions, BullMQ) ─────────────────────
  redis:
    image: redis:7-alpine
    container_name: kenzo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS API ────────────────────────────────────────────
  api:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    container_name: kenzo-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://kenzo_user:kenzo_password@postgres:5432/kenzo_hrms
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Next.js Web ───────────────────────────────────────────
  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    container_name: kenzo-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy

  # ─── Redis Commander (Dev Tools) ───────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: kenzo-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
