services:
  # NestJS Backend API
  - type: web
    name: kenzo-hrms-api
    env: node
    plan: free
    buildCommand: npm run build -w apps/api
    startCommand: npm run start:prod -w apps/api
    envVars:
      - key: NODE_VERSION
        value: 20.14.0

  # Next.js Frontend
  - type: web
    name: kenzo-hrms-web
    env: node
    plan: free
    buildCommand: npm run build -w apps/web
    startCommand: npm run start -w apps/web
    envVars:
      - key: NODE_VERSION
        value: 20.14.0

