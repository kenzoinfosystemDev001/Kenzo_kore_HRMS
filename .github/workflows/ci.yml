name: Kenzo HRMS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma Client
        run: npx prisma@5 generate --schema=apps/api/prisma/schema.prisma
      
      - name: Lint frontend
        run: npm run lint -w apps/web
      
      - name: Type check frontend
        run: npx tsc --noEmit -p apps/web/tsconfig.json
      
      - name: Type check backend
        run: npx tsc --noEmit -p apps/api/tsconfig.json

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kenzo_hrms_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma Client
        run: npx prisma@5 generate --schema=apps/api/prisma/schema.prisma
      
      - name: Run database migrations
        run: npx prisma db push --schema=apps/api/prisma/schema.prisma --accept-data-loss
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/kenzo_hrms_test
      
      - name: Run backend tests
        run: npm run test -w apps/api -- --coverage --passWithNoTests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/kenzo_hrms_test
          JWT_SECRET: test-jwt-secret-for-ci-pipeline
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
          PORT: 4000
          FRONTEND_URL: http://localhost:3000

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma Client
        run: npx prisma@5 generate --schema=apps/api/prisma/schema.prisma
      
      - name: Build backend
        run: npm run build -w apps/api
      
      - name: Build frontend
        run: npm run build -w apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL || 'http://localhost:4000' }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t kenzo-hrms-api:${{ github.sha }} .
      
      - name: Build Web Docker image
        run: docker build -f apps/web/Dockerfile -t kenzo-hrms-web:${{ github.sha }} .

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Preview
        run: echo "Preview deployment configured via Vercel GitHub integration"

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build, test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Frontend
        run: echo "Frontend deployment via Vercel GitHub integration"
      
      - name: Deploy Backend
        run: echo "Backend deployment to cloud provider"
